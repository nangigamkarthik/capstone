# =============================================================================
# Cognitive Classroom Digital Twin - Frontend Deployment & Service
# =============================================================================
# Purpose: Deploys the React/Next.js frontend application served via Nginx,
#          providing the 3D digital twin visualization interface.
#
# Components:
#   - Deployment: 2 replicas of the frontend container serving static assets
#   - Service:    LoadBalancer service exposing port 80 for external access
#
# Notes:
#   - The frontend container serves pre-built static files via Nginx on port 80.
#   - In production with an Ingress controller, consider switching the Service
#     type to ClusterIP and routing traffic through the Ingress resource.
#
# Usage:   kubectl apply -f frontend-deployment.yaml -n classroom-twin
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: classroom-twin
  labels:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cognitive-classroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cognitive-classroom
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognitive-classroom
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cognitive-classroom
    spec:
      containers:
        - name: frontend
          image: classroom-twin/frontend:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: classroom-twin
  labels:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cognitive-classroom
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
