# =============================================================================
# Cognitive Classroom Digital Twin - Secrets
# =============================================================================
# Purpose: Stores sensitive credentials required by platform services.
#
# ⚠️  WARNING: Replace ALL placeholder values before deploying to any environment!
#     The values below are NOT production-safe and MUST be changed.
#
# Security Notes:
#   - In production, use a secrets management solution (e.g., HashiCorp Vault,
#     AWS Secrets Manager, or Sealed Secrets) instead of plain manifests.
#   - NEVER commit real credentials to version control.
#   - stringData values are automatically base64-encoded by Kubernetes on apply.
#
# Usage:   kubectl apply -f secrets.yaml -n classroom-twin
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: classroom-twin-secrets
  namespace: classroom-twin
  labels:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: cognitive-classroom
type: Opaque
stringData:
  # Database password — MUST be replaced with a strong, unique password
  db-password: "CHANGE_ME"
  # Redis connection URL — update host/port if using external Redis
  redis-url: "redis://redis:6379/0"
  # JWT signing secret — MUST be replaced with a cryptographically random string
  jwt-secret: "CHANGE_ME"
  # LLM API key (e.g., OpenAI) — MUST be replaced with a valid API key
  llm-api-key: "CHANGE_ME"
