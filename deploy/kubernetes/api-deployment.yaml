# =============================================================================
# Cognitive Classroom Digital Twin - API Deployment & Service
# =============================================================================
# Purpose: Deploys the main FastAPI backend that handles REST endpoints,
#          WebSocket connections, and orchestrates AI processing pipelines.
#
# Components:
#   - Deployment: 2 replicas of the API server with health probes
#   - Service:    ClusterIP service exposing port 8000 for internal access
#
# Configuration:
#   - Environment variables injected from ConfigMap and Secrets
#   - Liveness probe:  Detects unresponsive pods (restarts after failure)
#   - Readiness probe: Controls traffic routing (removes from service if unhealthy)
#
# Usage:   kubectl apply -f api-deployment.yaml -n classroom-twin
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: classroom-twin
  labels:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cognitive-classroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cognitive-classroom
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognitive-classroom
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cognitive-classroom
    spec:
      containers:
        - name: api
          image: classroom-twin/api:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: classroom-twin-config
            - secretRef:
                name: classroom-twin-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: classroom-twin
  labels:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cognitive-classroom
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cognitive-classroom
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
