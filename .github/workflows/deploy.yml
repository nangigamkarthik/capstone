# ═══════════════════════════════════════════════════════════════════════════════
# Cognitive Classroom Digital Twin — Continuous Deployment Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# Purpose:  Build, push, and deploy container images on every version tag.
#
# Trigger:  Pushing a tag matching  v*  (e.g. v1.0.0, v2.3.1-rc.1)
#
# Jobs:
#   1. build-and-push  — Build multi-platform images and push to GHCR
#   2. deploy          — Roll out the new images to the Kubernetes cluster
#
# Required Secrets:
#   - KUBE_CONFIG       — Base64-encoded kubeconfig for the target cluster
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build & Push Container Images to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Deploying version: ${VERSION}"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Cognitive Classroom Digital Twin API
            org.opencontainers.image.description=FastAPI backend for the Digital Twin platform
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Cognitive Classroom Digital Twin Frontend
            org.opencontainers.image.description=React frontend for the Digital Twin platform
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy to Kubernetes
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update image tags in manifests
        run: |
          cd deploy/k8s
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ steps.version.outputs.version }}|g" *.yml *.yaml 2>/dev/null || true
          sed -i "s|API_IMAGE_PLACEHOLDER|${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}|g" *.yml *.yaml 2>/dev/null || true
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}|g" *.yml *.yaml 2>/dev/null || true

      - name: Apply Kubernetes manifests
        run: |
          cd deploy/k8s
          echo "🚀 Applying namespace and config..."
          kubectl apply -f namespace.yml        2>/dev/null || true
          kubectl apply -f configmap.yml         2>/dev/null || true
          kubectl apply -f secrets.yml           2>/dev/null || true

          echo "🗄️  Applying storage and databases..."
          kubectl apply -f postgres-pvc.yml      2>/dev/null || true
          kubectl apply -f postgres.yml          2>/dev/null || true
          kubectl apply -f redis.yml             2>/dev/null || true

          echo "🔧 Applying application services..."
          kubectl apply -f api-deployment.yml    2>/dev/null || true
          kubectl apply -f api-service.yml       2>/dev/null || true
          kubectl apply -f frontend-deployment.yml 2>/dev/null || true
          kubectl apply -f frontend-service.yml  2>/dev/null || true

          echo "🌐 Applying ingress..."
          kubectl apply -f ingress.yml           2>/dev/null || true

      - name: Wait for rollout to complete
        run: |
          echo "⏳ Waiting for API deployment rollout..."
          kubectl rollout status deployment/digital-twin-api \
            --namespace=digital-twin \
            --timeout=300s

          echo "⏳ Waiting for Frontend deployment rollout..."
          kubectl rollout status deployment/digital-twin-frontend \
            --namespace=digital-twin \
            --timeout=300s

      - name: Verify deployment
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  Deployment Verification — v${{ steps.version.outputs.version }}"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "📦 Pods:"
          kubectl get pods --namespace=digital-twin -o wide

          echo ""
          echo "🔌 Services:"
          kubectl get services --namespace=digital-twin

          echo ""
          echo "🌐 Ingress:"
          kubectl get ingress --namespace=digital-twin

          echo ""
          echo "✅ Deployment complete!"
